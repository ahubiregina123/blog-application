<! -- prettier ignore -->
{% extends 'layout.html' %} {% comment %}
<! -- prettier ignore -->
{% endcomment %} {% block title %} Posts {% endblock title %}

<! -- prettier ignore -->
{% block content %}
<section>
  <h1>Posts</h1>
  {% for post in posts %}
  <h2>
    <a href="{% url 'posts:page' post.slug %}"> {{post.title}}</a>
  </h2>
  <p>{{post.date}} by {{ post.author}}</p>
  <p>{{post.body}}</p>
  {% endfor %}
</section>
{% endblock content %}
